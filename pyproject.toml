[project]
name = "monroe-ai-layer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "pydantic[email]>=2.0",
    "pydantic-settings>=2.0",
    "bcrypt>=4.0",
    "python-jose[cryptography]>=3.3",
    "openai-agents==0.18.2",
    "litellm>=1.40",
    "openai>=1.30",
    "anthropic>=0.25",
    "tiktoken>=0.7",
    "python-multipart>=0.0.9",
    "websockets>=12.0",
    "httpx>=0.27",
    "aioboto3>=13.0",
    "pgvector>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "aiosqlite>=0.20",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
