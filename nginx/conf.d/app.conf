# Step 1: this file is used for initial cert issuance (HTTP only)
# Step 2: after certs are obtained, replace with full HTTPS config below

server {
    listen 80;
    server_name ai.easy-mo.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Uncomment after certs are obtained:
server {
    listen 443 ssl;
    server_name ai.easy-mo.ru;

    ssl_certificate /etc/letsencrypt/live/ai.easy-mo.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai.easy-mo.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 50m;

    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI runs synchronously inside the webhook. Worst case is two full runs back to
        # back: primary MiniMax model fails, then the M2.7 fallback retries — each capped
        # at AI_RUNNER_TIMEOUT=180s, so ~360s plus overhead. Must exceed that, and the CRM
        # timeout must exceed this (CRM=420s).
        proxy_read_timeout 400s;
        proxy_send_timeout 400s;
    }
}
