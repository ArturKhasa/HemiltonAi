# Step 1: this file is used for initial cert issuance (HTTP only)
# Step 2: after certs are obtained, replace with full HTTPS config below

server {
    listen 80;
    server_name ai.hemilton.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Uncomment after certs are obtained:
server {
    listen 443 ssl;
    server_name ai.hemilton.ru;

    ssl_certificate /etc/letsencrypt/live/ai.hemilton.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai.hemilton.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 50m;

    # Вебхук ВК: прогон модели идёт внутри запроса. Худший случай — два полных
    # прогона подряд: основная модель упала, следом ретрай резервной, каждый под
    # AI_RUNNER_TIMEOUT=180s, то есть ~360s плюс накладные. Таймаут должен это
    # переживать.
    location /webhook/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 400s;
        proxy_send_timeout 400s;
    }

    # Всё остальное — панель. Здесь те же 400 секунд означали, что запрос,
    # оборвавшийся на стороне приложения (например, контейнер перезапустился в
    # момент деплоя), держал вкладку почти семь минут: так «висело» добавление
    # группы, уже созданной в базе. Минуты хватает любому запросу панели с
    # запасом, а клиентский таймаут — 45 секунд, то есть сработает раньше.
    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
