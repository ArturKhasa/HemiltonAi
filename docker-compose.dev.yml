services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: hemilton
      POSTGRES_USER: hemilton
      POSTGRES_PASSWORD: hemilton_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hemilton -d hemilton"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://hemilton:hemilton_dev@db:5432/hemilton
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./logs:/app/logs
      - ./data/media:/app/data/media
    command: >
      sh -c "alembic upgrade head && python -m app.commands.seed &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  vk_webhook_proxy:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:8088:8080"
    volumes:
      - ./nginx/dev-vk-webhook.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

volumes:
  postgres_dev_data:
